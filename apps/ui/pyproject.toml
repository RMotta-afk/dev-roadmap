[project]
name = "ui"
version = "0.1.0"
description = "Streamlit UI for dev-roadmap"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "streamlit>=1.32.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "argon2-cffi>=23.1.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ui"]
