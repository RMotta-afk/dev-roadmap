services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cv_analyzer
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: cv_analyzer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_analyzer -d cv_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Host .env is interpolated by Compose; force same default as .env.example
      DATABASE_URL: postgresql+asyncpg://cv_analyzer:localdev@postgres:5432/cv_analyzer
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AUTHJWT_SECRET: ${AUTHJWT_SECRET:-local-dev-secret-change-in-production}
      CORS_ALLOW: ${CORS_ALLOW:-http://localhost:8501}
      BASE_ROADMAP_PATH: docs/archives
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    # Follow logs: docker compose logs -f api

  # Optional: docker compose --profile full up
  ui:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql://cv_analyzer:localdev@postgres:5432/cv_analyzer
      AUTHJWT_SECRET: ${AUTHJWT_SECRET:-local-dev-secret-change-in-production}
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
