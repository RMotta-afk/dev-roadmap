services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cv_analyzer
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: cv_analyzer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_analyzer -d cv_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cv_analyzer:localdev@postgres:5432/cv_analyzer
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: text-embedding-3-small
      AUTHJWT_SECRET: change-me-in-production
      CORS_ALLOW: http://localhost:3000
      BASE_ROADMAP_PATH: docs/archives
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
